<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飯店布品盤點系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; touch-action: manipulation; }
        .main-container { max-width: 500px; margin: 0 auto; }
        
        input[type="date"]::-webkit-calendar-picker-indicator { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        #signCanvas { display: block; width: 100%; height: 220px; background: #fff; border: 2px dashed #cbd5e1; border-radius: 0.5rem; touch-action: none; cursor: crosshair; }
        #calcModal { transition: transform 0.3s ease-in-out; }
        .calc-btn { user-select: none; transition: background 0.1s; }
        .calc-btn:active { background-color: #d1d5db; transform: scale(0.95); }
    </style>
</head>
<body class="p-3 pb-32 relative overflow-x-hidden">
    
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-green-700 text-white px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-[10000] font-bold">
        ✅ 數量已寫入雲端！
    </div>

    <div id="msgModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[20000]">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl">
            <div id="msgIcon" class="text-6xl mb-4">⚠️</div>
            <h3 id="msgText" class="text-xl font-bold text-gray-800 mb-6 leading-relaxed whitespace-pre-line">提示訊息</h3>
            <button onclick="closeMsg()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black text-xl shadow-md active:bg-blue-700">我知道了</button>
        </div>
    </div>

    <div class="main-container">
        <!-- ==================== 【首頁：飯店選擇入口大廳】 ==================== -->
        <div id="homeView">
            <div class="flex justify-between items-center mb-6 mt-4 px-1">
                <h1 class="text-4xl font-black text-gray-800">選擇飯店</h1>
                <button onclick="init()" class="bg-blue-100 text-blue-800 px-4 py-3 rounded-xl font-bold text-lg shadow-sm active:bg-blue-200">
                    🔄 雲端同步
                </button>
            </div>
            
            <div class="bg-white p-3 rounded-2xl shadow-sm mb-4 border border-gray-200 flex items-center justify-between">
                <div class="font-bold text-gray-700 text-base">🚦 儀表板燈號日期：</div>
                <div class="relative w-36 bg-orange-50 rounded-lg h-10 flex items-center justify-center border border-orange-200">
                    <div id="homeDateDisplay" class="w-full text-center font-bold text-orange-900 pointer-events-none">載入中...</div>
                    <input type="date" id="homeDatePicker" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="homeDateChanged()">
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm mb-6 flex flex-col gap-4 border border-gray-200">
                <div class="relative w-full h-16">
                    <span class="absolute left-5 top-4 text-gray-400 text-3xl">🔍</span>
                    <input id="searchInput" class="w-full h-full border-2 border-blue-200 focus:border-blue-500 rounded-xl text-2xl font-bold pl-16 pr-4 outline-none" placeholder="搜尋飯店名稱..." oninput="renderHome()">
                </div>
            </div>

            <div id="hotelGrid" class="grid grid-cols-3 gap-3 pb-10">
                <div class="col-span-3 text-center py-10 text-blue-600 font-bold text-2xl animate-pulse">資料同步中...</div>
            </div>
        </div>

        <!-- ==================== 【內頁：飯店部門盤點】 ==================== -->
        <div id="hotelView" class="hidden">
            <div class="flex items-center gap-3 mb-4 mt-2">
                <button onclick="goHome()" class="bg-gray-800 text-white px-5 py-3 rounded-xl font-black text-xl shadow-md active:bg-gray-700 flex-shrink-0">
                    ⬅️ 回首頁
                </button>
                <h1 id="currentBaseHotelTitle" class="text-3xl font-black text-blue-900 flex-1 text-center truncate px-2">
                    飯店名稱
                </h1>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm mb-5 border border-gray-200 flex flex-col gap-3">
                <div class="relative w-full">
                    <select id="deptSelect" onchange="changeDept(this.value)" class="w-full text-center font-black text-2xl p-4 outline-none bg-blue-100 border-2 border-blue-300 rounded-xl text-blue-900 appearance-none shadow-sm cursor-pointer">
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-4 flex items-center px-2 text-blue-900">
                        <svg class="fill-current h-8 w-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>

                <div class="relative w-full bg-gray-50 rounded-xl h-14 flex items-center justify-center border border-gray-200 mt-2">
                    <span class="absolute left-4 text-xl">📅</span>
                    <div id="dateDisplay" class="w-full text-center font-black text-xl pointer-events-none text-gray-800">載入中...</div>
                    <input type="date" id="datePicker" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="dateChanged()">
                </div>
            </div>

            <div id="itemsList" class="space-y-4"></div>

            <!-- ★ 手工打造的「絕對可見」智慧下拉選單 -->
            <div class="mt-8 bg-blue-50 p-5 rounded-2xl shadow-sm border-2 border-dashed border-blue-300">
                <h2 class="text-xl font-black mb-3 text-blue-800">➕ 找不到品項？今日臨時新增</h2>
                <div class="flex gap-2 relative">
                    <div class="relative flex-1">
                        <input id="newItemInput" class="w-full h-full p-4 text-xl font-bold border-2 border-blue-200 rounded-xl outline-none focus:border-blue-500 bg-white pr-14" placeholder="打字或點箭頭 👉">
                        
                        <!-- 絕對顯示的下拉按鈕 -->
                        <button id="dropdownBtn" onclick="toggleDropdown(event)" class="absolute right-2 top-1/2 transform -translate-y-1/2 p-2 bg-blue-100 text-blue-800 rounded-lg font-bold shadow-sm border border-blue-300 active:bg-blue-200 flex items-center justify-center h-10 w-10">
                            <svg class="w-6 h-6 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                        </button>

                        <!-- 手工打造的巨型清單面板 -->
                        <div id="customDropdownMenu" class="hidden absolute z-[30000] w-full mt-2 bg-white border-2 border-blue-300 rounded-xl shadow-2xl overflow-hidden">
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('方巾')">方巾</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('床墊')">床墊</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('枕頭')">枕頭</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('床包')">床包</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('羽毛被')">羽毛被</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('抱枕套')">抱枕套</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('置物墊')">置物墊</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('嬰兒床頭圍組')">嬰兒床頭圍組</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('嬰兒床包')">嬰兒床包</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('嬰兒被套')">嬰兒被套</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('嬰兒枕套')">嬰兒枕套</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('嬰兒床裙')">嬰兒床裙</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('桌裙')">桌裙</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('親子床單')">親子床單</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('親子被套')">親子被套</div>
                            <div class="p-4 border-b border-gray-100 text-2xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('涼被')">涼被</div>
                        </div>
                    </div>
                    
                    <button onclick="addNewItem()" class="p-4 bg-green-600 text-white rounded-xl font-black text-xl shadow-md active:bg-green-700 whitespace-nowrap">新增</button>
                </div>
            </div>
            <div class="h-10"></div>
        </div>
    </div>

    <!-- 簽名板 Modal -->
    <div id="signModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[10000]" onclick="if(event.target === this) closeSign()">
        <div class="bg-white p-4 rounded-3xl w-full max-w-sm" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-3">
                <h2 id="signModalTitle" class="text-lg font-black text-blue-800">簽名解鎖</h2>
                <button onclick="clearCanvas()" class="text-sm text-red-500 font-bold px-3 py-2 rounded-lg bg-red-50 border border-red-200 shadow-sm active:bg-red-100">清除重寫</button>
            </div>
            <canvas id="signCanvas"></canvas>
            <div class="mt-4 flex gap-2">
                <button onclick="closeSign()" class="flex-1 py-4 bg-gray-200 text-gray-700 rounded-xl font-bold text-xl">取消</button>
                <button onclick="confirmSignature()" class="flex-1 py-4 bg-blue-600 text-white rounded-xl font-bold text-xl shadow-md active:bg-blue-700">確認簽名</button>
            </div>
        </div>
    </div>

    <!-- 計算機鍵盤 Modal -->
    <div id="calcModal" class="fixed inset-x-0 bottom-0 transform translate-y-full bg-gray-100 shadow-[0_-5px_15px_rgba(0,0,0,0.2)] rounded-t-3xl z-[10001] max-w-md mx-auto">
        <div class="p-4">
            <div class="flex justify-between items-center mb-3">
                <span id="calcTitle" class="font-bold text-gray-500 text-base">正在計算：</span>
                <button onclick="closeCalc()" class="text-red-600 font-bold px-4 py-2 bg-red-100 rounded-lg active:bg-red-200">關閉</button>
            </div>
            <div id="calcDisplay" class="w-full bg-white border-2 border-blue-400 rounded-xl h-16 mb-4 flex items-center justify-end px-4 text-4xl font-black text-gray-800 tracking-wider overflow-hidden">0</div>
            <div class="grid grid-cols-4 gap-2 h-64">
                <button onclick="calcPress('7')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">7</button>
                <button onclick="calcPress('8')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">8</button>
                <button onclick="calcPress('9')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">9</button>
                <button onclick="calcPress('+')" class="calc-btn bg-blue-100 text-blue-700 rounded-xl text-4xl font-black shadow-sm border border-blue-200">＋</button>
                
                <button onclick="calcPress('4')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">4</button>
                <button onclick="calcPress('5')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">5</button>
                <button onclick="calcPress('6')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">6</button>
                <button onclick="calcPress('-')" class="calc-btn bg-red-100 text-red-700 rounded-xl text-4xl font-black shadow-sm border border-red-200">－</button>
                
                <button onclick="calcPress('1')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">1</button>
                <button onclick="calcPress('2')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">2</button>
                <button onclick="calcPress('3')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">3</button>
                <button onclick="calcBackspace()" class="calc-btn bg-gray-200 text-gray-700 rounded-xl text-xl font-bold shadow-sm active:bg-gray-300">退格</button>
                
                <button onclick="calcClear()" class="calc-btn bg-gray-200 text-gray-700 rounded-xl text-xl font-bold shadow-sm active:bg-gray-300">清除</button>
                <button onclick="calcPress('0')" class="calc-btn bg-white rounded-xl text-3xl font-bold shadow-sm border border-gray-200">0</button>
                <button onclick="calcConfirm()" class="calc-btn col-span-2 bg-green-600 text-white rounded-xl text-2xl font-black shadow-sm active:bg-green-700">確定並儲存</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyPrkLoz1QNrynxKK09CWgMNbuePWCmQdtmx8Iqwq9l90xk0ZGZSOc-N-bkTePyXb4RVA/exec";
        
        const todayHotels = ["飯店A", "飯店B"]; 

        let masterData = []; 
        let userInputs = {}; 
        
        let hotelStructure = {}; 
        let allBaseHotels = [];  
        let currentBaseHotel = ""; 
        let currentDept = "";      
        let currentHotelName = ""; 

        let hotelDateMemory = {};
        let activeCategory = ""; 
        let activeItem = "";
        let activeRole = ""; 
        
        const canvas = document.getElementById('signCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let calcExpr = "";

        function toggleDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('customDropdownMenu');
            menu.classList.toggle('hidden');
        }

        function selectOption(val) {
            document.getElementById('newItemInput').value = val;
            document.getElementById('customDropdownMenu').classList.add('hidden');
        }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('customDropdownMenu');
            const btn = document.getElementById('dropdownBtn');
            const input = document.getElementById('newItemInput');
            
            if (menu && !menu.classList.contains('hidden')) {
                if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target) && e.target !== input) {
                    menu.classList.add('hidden');
                }
            }
        });

        function showMessage(text, isError = true) {
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgIcon').innerText = isError ? "⚠️" : "💡";
            document.getElementById('msgModal').classList.remove('hidden');
        }
        function closeMsg() { document.getElementById('msgModal').classList.add('hidden'); }
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.remove('opacity-0'); 
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function getLocalDateString(dateObj) {
            return new Date(dateObj.getTime() - (dateObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        }

        function getTargetDateStr(baseName) {
            const today = new Date();
            if (todayHotels.includes(baseName)) {
                return getLocalDateString(today);
            } else {
                const tomorrow = new Date();
                tomorrow.setDate(today.getDate() + 1);
                return getLocalDateString(tomorrow);
            }
        }

        function homeDateChanged() {
            const d = new Date(document.getElementById('homeDatePicker').value);
            document.getElementById('homeDateDisplay').innerText = `${d.getMonth() + 1}月${d.getDate()}日`;
            renderHome(); 
        }

        async function init() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('homeDatePicker').value = getLocalDateString(tomorrow);
            
            homeDateChanged();
            goHome();
            document.getElementById('hotelGrid').innerHTML = `<div class="col-span-3 text-center py-10 text-blue-600 font-bold text-2xl animate-pulse">🔄 資料同步中...</div>`;
            
            try {
                const res = await fetch(`${API_URL}?action=getInventoryData&t=${new Date().getTime()}`);
                const data = await res.json();
                
                masterData = data.template || [];
                if (masterData.length === 0) throw new Error("無資料");
                
                if (data.records) {
                    data.records.forEach(r => {
                        if(!userInputs[r.date]) userInputs[r.date] = {};
                        if(!userInputs[r.date][r.hotel]) userInputs[r.date][r.hotel] = {};
                        
                        // ★ 修正 0 被判斷成空值的 Bug，確實保存數字 0
                        userInputs[r.date][r.hotel][r.item] = { 
                            count: (r.count !== undefined && r.count !== null) ? String(r.count) : "",
                            note: r.note, hasSigned: false, isSubmitted: true, 
                            signature: r.signature || "", 
                            doubleCount: (r.doubleCount !== undefined && r.doubleCount !== null) ? String(r.doubleCount) : "",
                            doubleSignature: r.doubleSignature || "", doubleHasSigned: false,
                            isSaving: false, saveError: false
                        };
                    });
                }
                
                hotelStructure = {};
                allBaseHotels = [];
                
                masterData.forEach(t => {
                    let base = t.baseName;
                    let dept = t.deptName;
                    
                    if (base && !hotelStructure[base]) {
                        hotelStructure[base] = [];
                        allBaseHotels.push(base);
                    }
                    if (base && !hotelStructure[base].includes(dept)) {
                        hotelStructure[base].push(dept);
                    }
                });

                renderHome(); 
            } catch (error) {
                document.getElementById('hotelGrid').innerHTML = `<div class="col-span-3 text-red-500 text-center mt-6 font-bold text-2xl">❌ 連線失敗，請重試</div>`;
            }
        }

        function renderHome() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = allBaseHotels.filter(c => c.toLowerCase().includes(keyword));
            
            const grid = document.getElementById('hotelGrid');
            if (filtered.length > 0) {
                grid.innerHTML = filtered.map(c => {
                    let isOrange = false;
                    const targetDate = document.getElementById('homeDatePicker').value;
                    
                    let targetCat = masterData.find(d => d.baseName === c && d.deptName === "房務");
                    let fullHotelName = targetCat ? targetCat.hotel : (c + " 房務");
                    
                    let templateItems = masterData.filter(d => d.hotel === fullHotelName).map(d => d.item);
                    let pillowIdx = templateItems.indexOf("枕套");
                    
                    if (pillowIdx !== -1) {
                        let targetItems = templateItems.slice(pillowIdx + 1);
                        const todayInputs = (userInputs[targetDate] && userInputs[targetDate][fullHotelName]) || {};
                        const customItems = Object.keys(todayInputs).filter(item => !templateItems.includes(item));
                        let allItemsToCheck = targetItems.concat(customItems);
                        
                        if (allItemsToCheck.length > 0) {
                            isOrange = allItemsToCheck.every(item => {
                                let u = todayInputs[item];
                                // ★ 只要有內容 (包含 0) 都能順利觸發橘燈
                                return u && u.count !== '' && u.count !== undefined && u.count !== null;
                            });
                        }
                    }

                    let btnClasses = isOrange 
                        ? "bg-orange-500 border-2 border-orange-600 shadow-lg active:bg-orange-600 text-white" 
                        : "bg-white border-2 border-blue-200 shadow-md active:bg-blue-100 text-blue-900";
                        
                    let shadowStyle = isOrange 
                        ? "text-shadow: 1px 1px 0px rgba(0,0,0,0.3);" 
                        : "text-shadow: 0.5px 0.5px 0px rgba(30,58,138,0.3);";

                    return `
                        <button onclick="goToHotel('${c}')" class="${btnClasses} rounded-2xl p-1 transition-colors flex items-center justify-center aspect-square">
                            <span class="text-3xl font-black break-words w-full text-center leading-tight tracking-wide" style="font-weight: 900; ${shadowStyle}">${c}</span>
                        </button>
                    `;
                }).join('');
            } else {
                grid.innerHTML = `<div class="col-span-3 text-center py-10 text-gray-500 font-bold text-2xl">找不到飯店</div>`;
            }
        }

        function goToHotel(baseName) {
            currentBaseHotel = baseName;
            
            if (hotelDateMemory[baseName]) {
                document.getElementById('datePicker').value = hotelDateMemory[baseName];
            } else {
                document.getElementById('datePicker').value = getTargetDateStr(baseName);
            }
            updateDateDisplay();

            let depts = hotelStructure[baseName] || [];
            currentDept = depts.includes("房務") ? "房務" : (depts[0] || "");
            
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('hotelView').classList.remove('hidden');
            document.getElementById('currentBaseHotelTitle').innerText = baseName;
            
            renderDeptDropdown();
            updateCurrentHotelName();
            renderItems();
        }

        function renderDeptDropdown() {
            let depts = hotelStructure[currentBaseHotel] || [];
            let html = "";
            depts.forEach(d => {
                let selected = (d === currentDept) ? "selected" : "";
                html += `<option value="${d}" ${selected}>📂 ${d}</option>`;
            });
            document.getElementById('deptSelect').innerHTML = html;
        }

        function changeDept(newDept) {
            currentDept = newDept;
            updateCurrentHotelName();
            renderItems();
        }

        function updateCurrentHotelName() {
            let target = masterData.find(d => d.baseName === currentBaseHotel && d.deptName === currentDept);
            if (target) {
                currentHotelName = target.hotel;
            } else {
                currentHotelName = currentDept === "房務" ? currentBaseHotel : (currentBaseHotel + " " + currentDept);
            }
        }

        function goHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('hotelView').classList.add('hidden');
            document.getElementById('searchInput').value = "";
            renderHome(); 
        }

        function dateChanged() { 
            if (currentBaseHotel) {
                hotelDateMemory[currentBaseHotel] = document.getElementById('datePicker').value;
            }
            updateDateDisplay(); 
            if(currentHotelName) renderItems(); 
        }
        
        function updateDateDisplay() {
            const d = new Date(document.getElementById('datePicker').value);
            document.getElementById('dateDisplay').innerText = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
        }

        function handleInput(date, category, item, field, value) {
            if (!userInputs[date]) userInputs[date] = {};
            if (!userInputs[date][category]) userInputs[date][category] = {};
            if (!userInputs[date][category][item]) userInputs[date][category][item] = { count: '', note: '', hasSigned: false, isSubmitted: false, signature: '', doubleCount: '', doubleSignature: '', doubleHasSigned: false, isSaving: false, saveError: false };
            userInputs[date][category][item][field] = value;
        }

        function addNewItem() {
            const inputEl = document.getElementById('newItemInput');
            const newItemName = inputEl.value.trim();
            const dateStr = document.getElementById('datePicker').value;

            if (!newItemName) return showMessage("請輸入要新增的品項名稱喔！");
            
            const inTemplate = masterData.some(d => d.hotel === currentHotelName && d.item === newItemName);
            const inToday = userInputs[dateStr] && userInputs[dateStr][currentHotelName] && userInputs[dateStr][currentHotelName][newItemName];

            if (inTemplate || inToday) return showMessage("這個品項已經在當天的列表裡面囉！");
            
            if (!userInputs[dateStr]) userInputs[dateStr] = {};
            if (!userInputs[dateStr][currentHotelName]) userInputs[dateStr][currentHotelName] = {};
            
            userInputs[dateStr][currentHotelName][newItemName] = { 
                count: '', note: '', hasSigned: false, isSubmitted: false, 
                signature: '', doubleCount: '', doubleSignature: '', doubleHasSigned: false,
                isSaving: false, saveError: false
            };

            inputEl.value = ""; 
            showToast("✅ 已為您新增臨時品項！");
            renderItems(); 
            setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 100);
        }

        function handleItemClick(item, role) {
            const dateStr = document.getElementById('datePicker').value;
            const u = (userInputs[dateStr] && userInputs[dateStr][currentHotelName] && userInputs[dateStr][currentHotelName][item]) || {};
            
            if (u.isSaving) return; 

            if (role === 'aunt') {
                if (u.doubleSignature) return showMessage("🔒 複點人員已簽名！\n現場數量已被完全鎖定，無法修改囉！");
                if (!u.hasSigned) return openSign(currentHotelName, item, 'aunt');
                openCalc(currentHotelName, item, 'aunt');
            } else if (role === 'sup') {
                if (!u.doubleHasSigned) return openSign(currentHotelName, item, 'sup');
                openCalc(currentHotelName, item, 'sup');
            }
        }

        function renderItems() {
            const dateStr = document.getElementById('datePicker').value;
            if (!currentHotelName) return;

            let displayItems = masterData.filter(d => d.hotel === currentHotelName).map(d => d.item);

            const todayInputs = (userInputs[dateStr] && userInputs[dateStr][currentHotelName]) || {};
            for (let itemName in todayInputs) {
                if (!displayItems.includes(itemName)) {
                    displayItems.push(itemName);
                }
            }

            let htmlContent = "";
            const loadingSvg = `<svg class="animate-spin h-4 w-4 text-gray-500 inline-block mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

            displayItems.forEach(itemName => {
                const u = todayInputs[itemName] || {};
                
                // ★ 修正 0 的顯示：強制判斷只要不是 undefiend 或空值，就算是 0 也要如實顯示！
                const count = (u.count !== undefined && u.count !== null && u.count !== '') ? u.count : '';
                const doubleCount = (u.doubleCount !== undefined && u.doubleCount !== null && u.doubleCount !== '') ? u.doubleCount : '';
                
                const hasSigned = u.hasSigned || false;
                const doubleHasSigned = u.doubleHasSigned || false;
                const isSubmitted = u.isSubmitted || false;
                const supSignedEver = u.doubleSignature ? true : false;
                const isSaving = u.isSaving || false;
                const saveError = u.saveError || false;
                
                let auntDisplayClass = hasSigned ? "bg-white text-gray-800 border-blue-300 shadow-inner" : "bg-gray-100 text-gray-400 border-gray-300";
                let auntText = count !== "" ? count : (hasSigned ? "輸入數量" : "🔒");
                let auntActionButton = "";

                if (isSaving) {
                    auntActionButton = `<div class="w-full py-2 bg-gray-200 text-gray-500 rounded-lg font-bold text-sm text-center border border-gray-300 shadow-inner">${loadingSvg} 寫入中...</div>`;
                } else if (supSignedEver) {
                    auntActionButton = `<div class="w-full py-2 bg-gray-200 text-gray-500 rounded-lg font-bold text-sm text-center border border-gray-300">🔒 已被複點鎖定</div>`;
                    auntDisplayClass = "bg-gray-200 text-gray-500 border-gray-300";
                } else if (saveError) {
                    auntActionButton = `<button onclick="submitItemToServer('${currentHotelName}', '${itemName}')" class="w-full py-2 bg-red-100 text-red-700 rounded-lg font-bold text-sm text-center border border-red-300 shadow-sm active:bg-red-200">❌ 寫入失敗 (點此重傳)</button>`;
                } else if (isSubmitted && !hasSigned) {
                    auntActionButton = `<button onclick="openSign('${currentHotelName}', '${itemName}', 'aunt')" class="w-full py-2 bg-gray-100 text-gray-700 rounded-lg font-bold text-sm text-center border border-gray-300 shadow-sm active:bg-gray-200">✅ 存檔成功(點此重簽)</button>`;
                } else if (hasSigned) {
                    auntActionButton = `<div class="w-full py-2 bg-blue-100 text-blue-700 rounded-lg font-bold text-sm text-center border border-blue-200 animate-pulse">👆 請輸入數量</div>`;
                } else {
                    auntActionButton = `<button onclick="openSign('${currentHotelName}', '${itemName}', 'aunt')" class="w-full py-2 bg-blue-600 text-white rounded-lg font-bold shadow-md text-sm active:bg-blue-700">第一步-簽名</button>`;
                }

                let supDisplayClass = doubleHasSigned ? "bg-white text-blue-800 border-green-500 shadow-inner" : "bg-white text-blue-400 border-blue-200";
                let supText = doubleCount !== "" ? doubleCount : (doubleHasSigned ? "輸入數量" : "等待輸入");
                let supActionButton = "";

                if (isSaving) {
                    supActionButton = `<div class="w-full py-2 bg-gray-200 text-gray-500 rounded-lg font-bold text-sm text-center border border-gray-300 shadow-inner">${loadingSvg} 寫入中...</div>`;
                } else if (saveError) {
                    supActionButton = `<button onclick="submitItemToServer('${currentHotelName}', '${itemName}')" class="w-full py-2 bg-red-100 text-red-700 rounded-lg font-bold text-sm text-center border border-red-300 shadow-sm active:bg-red-200">❌ 寫入失敗 (點此重傳)</button>`;
                } else if (isSubmitted && !doubleHasSigned && u.doubleSignature) {
                    supActionButton = `<button onclick="openSign('${currentHotelName}', '${itemName}', 'sup')" class="w-full py-2 bg-green-50 text-green-700 rounded-lg font-bold text-sm text-center border border-green-200 shadow-sm active:bg-green-100">✅ 複點完成(重簽)</button>`;
                } else if (doubleHasSigned) {
                    supActionButton = `<div class="w-full py-2 bg-orange-50 text-orange-600 rounded-lg font-bold text-sm text-center border border-orange-200 animate-pulse">👆 請輸入數量</div>`;
                } else {
                    supActionButton = `<button onclick="openSign('${currentHotelName}', '${itemName}', 'sup')" class="w-full py-2 bg-green-600 text-white rounded-lg font-bold shadow-md text-sm active:bg-green-700">第二步-複點簽名</button>`;
                }

                let cardClass = supSignedEver 
                    ? "bg-pink-100 border-2 border-pink-400 shadow-md" 
                    : "bg-white border border-gray-200 shadow-sm";

                htmlContent += `
                <div class="${cardClass} p-4 rounded-2xl relative overflow-hidden transition-colors duration-300">
                    <div class="font-black text-2xl text-gray-800 mb-3 z-20 relative">${itemName}</div>
                    
                    <div class="flex gap-2 mb-4 relative z-20">
                        <div class="flex-1 bg-gray-50 rounded-xl p-3 border border-gray-200 flex flex-col justify-between ${supSignedEver ? 'opacity-60' : ''}">
                            <div class="text-sm font-bold text-gray-500 mb-2 text-center">現場數量</div>
                            <div onclick="handleItemClick('${itemName}', 'aunt')" class="px-1 py-3 text-center font-black text-3xl border-b-4 rounded-t-lg cursor-pointer mb-3 ${auntDisplayClass}">
                                ${auntText}
                            </div>
                            ${auntActionButton}
                        </div>
                        
                        <div class="flex-1 bg-blue-50 rounded-xl p-3 border border-blue-200 flex flex-col justify-between">
                            <div class="text-sm font-bold text-blue-700 mb-2 text-center">複點數量</div>
                            <div onclick="handleItemClick('${itemName}', 'sup')" class="px-1 py-3 text-center font-black text-3xl border-b-4 rounded-t-lg cursor-pointer mb-3 ${supDisplayClass}">
                                ${supText}
                            </div>
                            ${supActionButton}
                        </div>
                    </div>
                    
                    <input type="text" 
                        oninput="handleInput('${dateStr}', '${currentHotelName}', '${itemName}', 'note', this.value)"
                        onchange="submitItemToServer('${currentHotelName}', '${itemName}')"
                        value="${u.note || ''}" 
                        ${isSaving ? 'disabled' : ''}
                        class="w-full p-3 border border-gray-200 rounded-xl text-base outline-none bg-gray-50 relative z-20 focus:border-blue-500" 
                        placeholder="📝 點此可寫備註(寫完自動存)">
                </div>`;
            });

            document.getElementById('itemsList').innerHTML = htmlContent;
        }

        function setupCanvas() {
            canvas.isModified = false; canvas.isLocked = false; 
            function start(e) { 
                if (canvas.isLocked) return showMessage("🔒 必須重新簽名才能修改數量！\n👉 請先點擊右上角的【清除重寫】按鈕。");
                painting = true; draw(e); 
            }
            function draw(e) {
                if(!painting) return; e.preventDefault(); 
                canvas.isModified = true;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
            }
            function stop() { painting = false; ctx.beginPath(); }
            canvas.addEventListener('mousedown', start); canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('mousemove', draw); canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('mouseup', stop); canvas.addEventListener('touchend', stop);
        }
        setupCanvas();

        function clearCanvas() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            canvas.isModified = true; canvas.isLocked = false; 
            const titleEl = document.getElementById('signModalTitle');
            titleEl.innerText = activeRole === 'aunt' ? "請現場人員簽上新名字" : "請複點人員簽上新名字";
            titleEl.className = "text-lg font-black text-blue-800";
        }

        function closeSign() { document.getElementById('signModal').classList.add('hidden'); }
        
        function openSign(category, item, role) { 
            activeCategory = category; activeItem = item; activeRole = role;
            document.getElementById('signModal').classList.remove('hidden'); 

            const dateStr = document.getElementById('datePicker').value;
            const u = (userInputs[dateStr] && userInputs[dateStr][category] && userInputs[dateStr][category][item]) || {};
            const existingSig = role === 'aunt' ? u.signature : u.doubleSignature;
            const isSubmitted = u.isSubmitted;

            requestAnimationFrame(() => {
                canvas.width = canvas.offsetWidth || 300; canvas.height = 220; canvas.isModified = false; 
                ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; ctx.clearRect(0, 0, canvas.width, canvas.height);

                canvas.isLocked = (isSubmitted && existingSig && !u.saveError) ? true : false;
                const titleEl = document.getElementById('signModalTitle');
                
                if (canvas.isLocked) {
                    titleEl.innerText = "🔒 請先按【清除重寫】才能修改";
                    titleEl.className = "text-lg font-black text-red-600 animate-pulse";
                } else {
                    titleEl.innerText = role === 'aunt' ? "第一步：現場人員簽名解鎖" : "第二步：複點人員簽名";
                    titleEl.className = "text-lg font-black text-blue-800";
                }

                if (existingSig) {
                    let img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = existingSig;
                }
            });
        }

        function confirmSignature() {
            if (canvas.isLocked) return showMessage("🔒 您尚未重新簽名！\n👉 請先點擊右上角的【清除重寫】並簽上新名字。");
            
            let isBlank = !ctx.getImageData(0,0,canvas.width,canvas.height).data.some(c => c !== 0);
            if (isBlank) return showMessage("請先在空白處簽名喔！");

            let sigBase64 = canvas.toDataURL('image/png');
            const dateStr = document.getElementById('datePicker').value; 
            
            if (activeRole === 'aunt') {
                handleInput(dateStr, activeCategory, activeItem, 'signature', sigBase64);
                handleInput(dateStr, activeCategory, activeItem, 'hasSigned', true); 
            } else {
                handleInput(dateStr, activeCategory, activeItem, 'doubleSignature', sigBase64);
                handleInput(dateStr, activeCategory, activeItem, 'doubleHasSigned', true); 
            }
            
            handleInput(dateStr, activeCategory, activeItem, 'isSubmitted', false); 
            handleInput(dateStr, activeCategory, activeItem, 'saveError', false);
            closeSign(); renderItems(); openCalc(activeCategory, activeItem, activeRole); 
        }

        function openCalc(hotel, item, role) {
            activeCategory = hotel; activeItem = item; activeRole = role;
            const dateStr = document.getElementById('datePicker').value;
            const roleName = role === 'aunt' ? '現場人員' : '複點人員';
            document.getElementById('calcTitle').innerText = `${roleName}正在計算：${item}`;
            
            const u = (userInputs[dateStr] && userInputs[dateStr][hotel] && userInputs[dateStr][hotel][item]) || {};
            // ★ 修正 0 在計算機中變空白的 Bug
            let c = (role === 'aunt') ? u.count : u.doubleCount;
            calcExpr = String((c !== undefined && c !== null && c !== '') ? c : "");
            
            document.getElementById('calcDisplay').innerText = calcExpr || "0";
            document.getElementById('calcModal').classList.remove('translate-y-full');
        }

        function closeCalc() { document.getElementById('calcModal').classList.add('translate-y-full'); }
        function calcPress(val) { calcExpr += val; document.getElementById('calcDisplay').innerText = calcExpr; }
        function calcBackspace() { calcExpr = calcExpr.slice(0, -1); document.getElementById('calcDisplay').innerText = calcExpr || "0"; }
        function calcClear() { calcExpr = ""; document.getElementById('calcDisplay').innerText = "0"; }

        function calcConfirm() {
            let finalValue = 0;
            try { finalValue = /^[0-9\+\-]+$/.test(calcExpr) ? Function("return " + calcExpr)() : (parseInt(calcExpr) || 0); } catch (e) { finalValue = 0; }

            const dateStr = document.getElementById('datePicker').value;
            
            if (activeRole === 'aunt') {
                handleInput(dateStr, activeCategory, activeItem, 'count', finalValue);
                const u = (userInputs[dateStr] && userInputs[dateStr][activeCategory] && userInputs[dateStr][activeCategory][activeItem]) || {};
                if (!u.doubleSignature) {
                    handleInput(dateStr, activeCategory, activeItem, 'doubleCount', finalValue);
                }
            } else {
                handleInput(dateStr, activeCategory, activeItem, 'doubleCount', finalValue);
            }
            
            closeCalc(); renderItems(); submitItemToServer(activeCategory, activeItem);
        }

        function submitItemToServer(category, item) {
            const dateStr = document.getElementById('datePicker').value;
            const u = (userInputs[dateStr] && userInputs[dateStr][category] && userInputs[dateStr][category][item]) || null;
            if (!u) return;

            if(!u.signature && !u.doubleSignature) return; 

            const payload = { 
                type: 'inventory', date: dateStr, hotel: category, item: item, 
                // ★ 修正 0 存入後台變成空白的 Bug，確保將 0 以字串形式傳送
                count: (u.count !== undefined && u.count !== null && u.count !== '') ? String(u.count) : '', 
                note: u.note || '', signature: u.signature || '', 
                doubleCount: (u.doubleCount !== undefined && u.doubleCount !== null && u.doubleCount !== '') ? String(u.doubleCount) : '', 
                doubleSignature: u.doubleSignature || '',
                timestamp: new Date().toLocaleString() 
            };
            
            handleInput(dateStr, category, item, 'isSaving', true);
            handleInput(dateStr, category, item, 'saveError', false);
            renderItems();

            fetch(API_URL, { 
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload) 
            })
            .then(res => res.json())
            .then(data => {
                if (data.status !== "success") throw new Error("伺服器端錯誤");
                
                handleInput(dateStr, category, item, 'isSaving', false);
                handleInput(dateStr, category, item, 'isSubmitted', true); 
                handleInput(dateStr, category, item, 'hasSigned', false); 
                handleInput(dateStr, category, item, 'doubleHasSigned', false); 
                renderItems();
                showToast("✅ 數量已寫入雲端！");
            })
            .catch(e => {
                handleInput(dateStr, category, item, 'isSaving', false);
                handleInput(dateStr, category, item, 'saveError', true);
                renderItems();
                showMessage("⚠️ 網路連線不穩或伺服器忙碌！\n\n您的資料已保留在畫面上，請確認網路訊號後，點擊紅色的「寫入失敗(點此重傳)」按鈕即可！");
            });
        }
        
        init();
    </script>
</body>
</html>
